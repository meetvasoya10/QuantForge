[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantforge"
version = "1.0.0"
description = "Advanced LLM Quantization Engine for Low-Bit Transformer Inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "accelerate>=0.25.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "tabulate>=0.9.0",
    "psutil>=5.9.0",
]

[project.scripts]
quantforge-baseline   = "quantforge.scripts.run_baseline:main"
quantforge-quantized  = "quantforge.scripts.run_quantized:main"
quantforge-kv-cache   = "quantforge.scripts.run_kv_cache:main"
quantforge-all        = "quantforge.scripts.run_all:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantforge*"]
